# nginx đứng trước Umaru: phục vụ SPA + proxy API (gồm WebSocket).
#
# Ba chỗ bắt buộc phải đúng, mỗi chỗ hỏng theo một kiểu riêng:
#   1. WebSocket upgrade — thiếu là gateway **im lặng**: HTTP 200 trả về, client
#      chờ mãi frame HELLO, app treo ở "đang kết nối".
#   2. `client_max_body_size` — mặc định 1MB, trong khi trần tệp đính kèm là
#      10MB và avatar 5MB → upload lớn nhận 413 từ nginx chứ không phải từ API.
#   3. SPA fallback — `/` và mọi đường dẫn phía client phải trả index.html, nếu
#      không thì F5 ở `/terms` là 404.

# Map cho header `Connection`: nginx không được gửi "close" khi client muốn
# nâng cấp, và phải gửi "upgrade" đúng lúc.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

upstream umaru_api {
  # Tên service trong docker-compose. Đổi thành địa chỉ host nếu chạy ngoài
  # compose (ví dụ `127.0.0.1:4000`).
  server api:4000;
  # Giữ kết nối tới API để không bắt tay TCP cho từng request.
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  # Trần body: 12m để dư cho multipart (nhiều tệp + boundary) trong khi API vẫn
  # là nơi quyết định trần thật (10MB/tệp, tối đa 5 tệp/tin → 413 đúng thông điệp).
  client_max_body_size 12m;

  # Nén: SPA bundle là JS/CSS văn bản, nén giảm ~70% dung lượng truyền.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Header bảo mật cơ bản. CSP cố ý **không** đặt ở đây: app gắn blob URL cho
  # avatar và tệp đính kèm, đặt sai là ảnh biến mất; cần người hiểu app rà lại.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ---- API (REST) ----
  location /api/ {
    proxy_pass http://umaru_api;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # API chỉ tin header này khi TRUST_PROXY=1 (xem config.ts) — rate limit theo
    # IP phụ thuộc vào nó, sai là mọi người dùng chung một bộ đếm.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # SSE/upload chậm: đừng cắt kết nối sau 60 giây mặc định.
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_request_buffering off;
  }

  # ---- Gateway WebSocket ----
  # Đặt **trước** /api/ để regex này thắng; nginx chọn `location` khớp nhất nên
  # thực tế thứ tự không quyết định, nhưng để gần nhau cho dễ đọc.
  location /api/v1/gateway/ws {
    proxy_pass http://umaru_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    # Socket sống lâu: heartbeat mặc định 41,25s, để 1 giờ cho chắc. Đặt thấp
    # hơn heartbeat là nginx cắt kết nối "đang khỏe" và client reconnect liên tục.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }

  # ---- SPA ----
  location /assets/ {
    root /usr/share/nginx/html;
    # Vite sinh tên có hash nội dung → cache vĩnh viễn an toàn.
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  # index.html không được cache: nếu cache, người dùng giữ HTML cũ trỏ tới
  # asset đã bị xoá sau lần deploy sau → trắng trang.
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Service worker **không** được cache: bản cũ sẽ tiếp tục phục vụ thông báo
  # đẩy theo logic cũ dù đã deploy bản mới.
  location = /sw.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache, must-revalidate";
    # SW phải nằm ở scope gốc để điều khiển toàn app.
    add_header Service-Worker-Allowed "/";
  }
}
